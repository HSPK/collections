name: Website bug
description: Report a reproducible problem in a project or the collection.
title: "[Bug] "
body:
  - type: input
    id: project
    attributes:
      label: Project URL
      placeholder: https://hspk.github.io/collections/projects/...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the exact controls or sequence. Do not paste private data or credentials.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Browser/version, desktop or phone, approximate screen size
  - type: textarea
    id: media
    attributes:
      label: Screenshot or additional context
      description: Remove any personal or sensitive information before attaching media.
